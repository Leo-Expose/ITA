name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest fastapi uvicorn

      - name: Run unit/integration tests (exclude optional e2e)
        run: |
          pytest -q -k "not e2e"

      - name: Run smoke checks
        run: |
          python scripts/smoke_checks.py
